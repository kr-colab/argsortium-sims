# Simulation parameters
species_name: "HomSap"
model_name: "OutOfAfrica_3G09"

# Sample configuration
samples:
        YRI: 5 # Yoruba
        CEU: 0 # Utah Residents (CEPH)
        CHB: 10 # Han Chinese

# Chromosome list for parallelization
contigs:
          - chr: chr14
            start: 27572179
            end: 28322179

          - chr: chr1
            start: 37572179
            end: 38322179

# Genetic map
genetic_map: "HapMapII_GRCh38"

# Outgroup configuration
add_outgroup: true
outgroup_time: 215000 # generations ago

# Mutation parameters
mutation_model: "HKY" # Options: HKY, JC69, GTR, BinaryMutationModel
discrete_genome: true # Use discrete genome (finite sites)

# Reproducibility
base_seed: 666 # Each contig gets: base_seed + contig_index + first digit of start + last digit of end

# Output
output_dir: "results/simulations"
